<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descargar Rekalp</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://rekalp.com/download">
<link rel="stylesheet" href="../css/site.css">
</head>
<body>

<nav class="topbar">
  <div class="wrap">
    <a href="../index.html"><img class="brand-logo" src="../assets/logo.svg" alt="Rekalp"></a>
    <div class="lang-switch"><button type="button" data-lang-switch="es-ES" aria-label="Español"><img src="../assets/icons/flag_es.svg" alt=""></button><button type="button" data-lang-switch="en" aria-label="English"><img src="../assets/icons/flag_en.svg" alt=""></button></div>
  </div>
</nav>

<div class="simple-page">
  <div class="simple-card">
    <h1 data-i18n="download.title">Rekalp está disponible en iOS y Android.</h1>
    <div class="store-row" style="justify-content:center;">
      <span class="store-badge">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.42 2.1-1.26 2.91-.9.87-1.95 1.32-3.15 1.26-.03-1.11.42-2.1 1.26-2.94.87-.9 1.98-1.35 3.15-1.23zM20.46 17.19c-.42.96-.9 1.83-1.47 2.61-.78 1.08-1.56 2.16-2.82 2.19-1.23.03-1.65-.75-3.06-.75-1.44 0-1.89.72-3.09.78-1.23.06-2.16-1.17-2.97-2.25-1.62-2.19-2.88-6.21-1.2-8.94.84-1.38 2.31-2.25 3.9-2.28 1.2-.03 1.95.81 2.97.81 1.02 0 1.65-.81 3.09-.81 1.26 0 2.61.69 3.57 1.89-3.15 1.95-2.64 6.24.09 7.56z"/></svg>
        <span><span class="store-label">App Store</span></span>
      </span>
      <span class="store-badge">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.6 2.4 13.8 12 3.6 21.6c-.3-.2-.5-.5-.5-.9V3.3c0-.4.2-.7.5-.9zM15 13.2l2.5 2.5-10.3 5.9 7.8-8.4zM21.1 10.7c.6.5.6 1.3 0 1.8l-2.4 1.9L16.1 12l2.6-2.4 2.4 1.1zM15 10.8 7.2 2.4l10.3 5.9L15 10.8z"/></svg>
        <span><span class="store-label">Google Play</span></span>
      </span>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="footer-links">
      <a href="../support/index.html" data-i18n="footer.support">Soporte</a>
      <a href="../privacy/index.html" data-i18n="footer.privacy">Privacidad</a>
      <a href="../terms/index.html" data-i18n="footer.terms">Términos</a>
      <a href="../legal/index.html" data-i18n="footer.legal">Aviso legal</a>
      <a href="../delete-account/index.html" data-i18n="footer.deleteAccount">Eliminar cuenta</a>
    </div>
    <span class="footer-copy" data-i18n="footer.copyright">© 2026 Rekalp</span>
  </div>
</footer>

<script src="../js/i18n.js"></script>
<script>
(function () {
  // FASE 0: no store listing exists yet, so this page is just a redirect
  // back home — matches spec exactly ("si alguien comparte el enlace antes
  // de tiempo"). The device-detection logic below is built for FASE 1+ but
  // never runs yet.
  var FASE = 0;
  if (FASE === 0) {
    window.location.replace('../index.html');
    return;
  }

  var src = new URLSearchParams(window.location.search).get('src') || 'directo';
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua);
  var isAndroid = /Android/.test(ua);

  // TODO once real store listings exist: replace these with the actual
  // App Store / Google Play URLs, keeping the ct=/referrer= attribution
  // params from spec §3.5.
  var APP_STORE_URL = 'https://apps.apple.com/app/idXXXXXXXXX?ct=' + encodeURIComponent(src) + '&pt=XXXXXXXX';
  var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.rekalp.app&referrer=utm_source%3D' + encodeURIComponent(src);

  if (isIOS) {
    window.location.replace(APP_STORE_URL);
  } else if (isAndroid) {
    window.location.replace(PLAY_STORE_URL);
  }
  // Desktop/other: falls through and shows the reservation page above,
  // with store badges linking to the same two URLs.
  document.querySelectorAll('.store-badge').forEach(function (el, i) {
    el.style.cursor = 'pointer';
    el.addEventListener('click', function () {
      window.location.href = i === 0 ? APP_STORE_URL : PLAY_STORE_URL;
    });
  });
})();
</script>

</body>
</html>
